# Thor sees both providers, on a different plan with each one.
strange_thor:
  provider: strange
  client: thor
  plan: premium

banner_thor:
  provider: banner
  client: thor
  plan: basic

strange_steve:
  provider: strange
  client: steve
  plan: basic

# Peter is only with Banner, so Peter stays out of Strange's feed.
banner_peter:
  provider: banner
  client: peter
  plan: premium
